name: Refresh Managed News

on:
  schedule:
    - cron: "17 */6 * * *"
      timezone: "Pacific/Honolulu"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-managed-news
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out the current site
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Validate the production build
        run: |
          npm ci
          npm run refresh:ra
          if [ -n "${DATABASE_URL}" ]; then
            npm run refresh:topics
          else
            echo "DATABASE_URL secret not set; skipping DB topic refresh."
          fi
          npm run lint
          npm run build
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Publish changed content
        run: |
          if git diff --quiet -- data/ra-news.json; then
            echo "No file-backed RA News changes."
            exit 0
          fi
          git config user.name "Managed News Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/ra-news.json
          git commit -m "Refresh RA News"
          git push
